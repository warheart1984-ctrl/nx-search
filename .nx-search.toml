# nx-search configuration file
# Specifies which directories to index and security settings

# Allowed roots (empty list means refuse to index)
roots = [
  # "C:\\Users\\%USERNAME%\\Documents",
  # "G:\\Project Finish",
  # "G:\\Project Infinity",
]

# Secret file exclusion patterns (cannot be removed without --allow-unsafe)
secret_exclude_patterns = [
  "*.env*",
  "*.pem",
  "*.key",
  "*.p12",
  "*.pfx",
  "id_rsa*",
  "id_ed25519*",
  "credentials*.json",
  "*secret*",
  "*.kdbx",
  ".npmrc",
  ".pypirc",
  ".netrc",
  ".git-credentials",
  "secrets/",
  "passwords/",
  "credentials/",
]

# Directories to always skip (in addition to default SKIP_DIRS)
extra_skip_dirs = [
  # "C:\\Windows",
  # "C:\\Program Files",
  # "C:\\Program Files (x86)",
]

# Security settings
[security]
# Enable index encryption (requires SQLCipher)
encryption = false

# Maximum search results per query
search_result_cap = 50

# Rate limit: queries per minute per user
rate_limit_qpm = 60

# Enable audit logging
audit_logging = true

# Paths to scan for .gitignore (leave empty to use default)
gitignore_paths = [
  # "."  # current directory
]

# Content redaction patterns (regex)
redaction_patterns = [
  # "-----BEGIN .*PRIVATE KEY-----",
  # "AKIA[0-9A-Z]{16}",
  # "sk-\\w+",
  # "xox[bp]-\\w+",
  # "(api_key|password|secret|token)\\s*[:=]\\s*\\S+",
]